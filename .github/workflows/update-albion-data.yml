name: Update Albion Online data

on:
  schedule:
    # Daily maintenance starts around 10:00 UTC; run one hour later.
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-albion-data.yml"

permissions:
  contents: write

concurrency:
  group: albion-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pycryptodome xmltodict

      - name: Download official Albion Online installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "albion-online-setup.exe"
          $baseUrl = "https://live.albiononline.com/clients"
          $candidateUrls = [System.Collections.Generic.List[string]]::new()

          foreach ($pageUrl in @(
            "https://albiononline.com/en/download",
            "https://albiononline.com/download"
          )) {
            try {
              $page = Invoke-WebRequest -Uri $pageUrl -MaximumRedirection 10 -TimeoutSec 30 -UseBasicParsing
              foreach ($match in [regex]::Matches(
                $page.Content,
                "https://live\.albiononline\.com/clients/\d+/albion-online-setup\.exe",
                [System.Text.RegularExpressions.RegexOptions]::IgnoreCase
              )) {
                $candidateUrls.Add($match.Value)
              }
            }
            catch {
              Write-Host "Could not inspect Albion download page: $($_.Exception.Message)"
            }
          }

          $candidateUrls.Add("$baseUrl/20261102100206/albion-online-setup.exe")

          $candidateUrls = @($candidateUrls | Select-Object -Unique)
          $downloadedSuccessfully = $false

          Write-Host "Testing $($candidateUrls.Count) official installer URL(s)..."

          foreach ($url in $candidateUrls) {
            try {
              Write-Host "Testing: $url"
              $response = Invoke-WebRequest `
                -Uri $url `
                -Method Head `
                -MaximumRedirection 5 `
                -TimeoutSec 30 `
                -UseBasicParsing `
                -ErrorAction Stop

              if ($response.StatusCode -eq 200) {
                Write-Host "Found working URL, downloading..."
                Invoke-WebRequest `
                  -Uri $url `
                  -OutFile $installer `
                  -MaximumRedirection 10 `
                  -TimeoutSec 600 `
                  -UseBasicParsing `
                  -ErrorAction Stop

                $fileSize = (Get-Item $installer).Length
                $fileSizeMB = [math]::Round($fileSize / 1MB, 2)

                if ($fileSize -lt 100MB) {
                  throw "Downloaded Albion installer is unexpectedly small ($fileSizeMB MB)."
                }

                Write-Host "Successfully downloaded installer ($fileSizeMB MB)"
                $downloadedSuccessfully = $true
                break
              }
            }
            catch {
              Write-Host "URL unavailable: $($_.Exception.Message)"
            }
          }

          if (-not $downloadedSuccessfully) {
            throw "Unable to download the official Albion Online installer from any candidate URL."
          }

      - name: Download and update Albion Online
        id: install_game
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "albion-online-setup.exe"

          if (-not (Test-Path $installer)) {
            throw "The Albion Online installer download is missing."
          }

          & $installer "/S"
          $installerExitCode = $LASTEXITCODE
          Write-Host "Albion Online installer exit code: $installerExitCode"
          if ($installerExitCode -ne 0) {
            throw "Albion Online installer failed with exit code $installerExitCode."
          }

          function Find-GameData {
            param([string[]]$Roots)

            foreach ($root in $Roots) {
              if (-not (Test-Path $root)) {
                continue
              }

              $gameData = Get-ChildItem `
                -Path $root `
                -Directory `
                -Filter "GameData" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.FullName -match '[\\/]StreamingAssets[\\/]GameData$' -and
                  @(Get-ChildItem -Path $_.FullName -Filter "*.bin" -File -ErrorAction SilentlyContinue).Count -gt 0
                } |
                Select-Object -First 1

              if ($gameData) {
                return $gameData
              }
            }

            return $null
          }

          $searchRoots = [System.Collections.Generic.List[string]]::new()
          foreach ($registryPath in @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall"
          )) {
            if (-not (Test-Path $registryPath)) {
              continue
            }

            Get-ChildItem $registryPath -ErrorAction SilentlyContinue |
              Get-ItemProperty |
              Where-Object {
                $_.DisplayName -match "Albion Online" -or $_.Publisher -match "Sandbox Interactive"
              } |
              ForEach-Object {
                foreach ($candidate in @($_.InstallLocation, $_.DisplayIcon, $_.UninstallString)) {
                  if ([string]::IsNullOrWhiteSpace($candidate)) {
                    continue
                  }

                  $candidate = $candidate.Trim().Trim('"')
                  if ($candidate -match "\.exe(?:$|\s)") {
                    $candidate = [System.IO.Path]::GetDirectoryName(
                      ($candidate -replace '^"([^"]+)".*$', '$1')
                    )
                  }

                  if ($candidate -and (Test-Path $candidate)) {
                    $searchRoots.Add($candidate)
                  }
                }
              }
          }

          foreach ($root in @(
            "C:\Albion",
            "C:\Program Files\Albion Online",
            "C:\Program Files (x86)\Albion Online",
            (Join-Path $env:LOCALAPPDATA "Albion Online")
          )) {
            if (Test-Path $root) {
              $searchRoots.Add($root)
            }
          }

          $searchRoots = @($searchRoots | Select-Object -Unique)
          $gameData = Find-GameData -Roots $searchRoots

          if (-not $gameData) {
            $launcher = $null
            foreach ($knownLauncher in @(
              "C:\Program Files (x86)\Albion Online\launcher\AlbionLauncher.exe",
              "C:\Program Files\Albion Online\launcher\AlbionLauncher.exe",
              "C:\Albion\launcher\AlbionLauncher.exe"
            )) {
              if (Test-Path $knownLauncher) {
                $launcher = Get-Item $knownLauncher
                break
              }
            }

            if (-not $launcher) {
              $launcher = Get-ChildItem `
                -Path $searchRoots `
                -File `
                -Filter "AlbionLauncher.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            $launcherProcess = $null
            if ($launcher) {
              Write-Host "Starting the Albion launcher to complete the game download."
              $launcherProcess = Start-Process `
                -FilePath $launcher.FullName `
                -WorkingDirectory $launcher.DirectoryName `
                -PassThru
            }
            else {
              Write-Host "No Albion launcher executable was found."
            }

            $deadline = (Get-Date).AddMinutes(30)
            while ((Get-Date) -lt $deadline) {
              $gameData = Find-GameData -Roots $searchRoots
              if ($gameData) {
                break
              }
              if (($launcherProcess) -and ($launcherProcess.HasExited)) {
                Write-Host "Albion launcher exited before GameData appeared."
              }
              Start-Sleep -Seconds 15
            }

            if ($launcherProcess -and -not $launcherProcess.HasExited) {
              Stop-Process -Id $launcherProcess.Id -Force
            }
          }

          if (-not $gameData) {
            throw "Albion Online GameData directory was not found after installation."
          }

          "game_data=$($gameData.FullName)" >> $env:GITHUB_OUTPUT

      - name: Clear stale extracted data
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path "data") {
            Remove-Item "data" -Recurse -Force
          }
          New-Item "data" -ItemType Directory | Out-Null

      - name: Decrypt game files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python app.py `
            --main-game-folder "${{ steps.install_game.outputs.game_data }}" `
            --output "${{ github.workspace }}\data" `
            --flat-output
          if ($LASTEXITCODE -ne 0) {
            throw "Albion data decryption failed with exit code $LASTEXITCODE."
          }

      - name: Validate extracted data
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem "data" -File -Recurse
          $xmlCount = @($files | Where-Object { $_.Extension -eq ".xml" }).Count
          $jsonCount = @($files | Where-Object { $_.Extension -eq ".json" }).Count

          if ($xmlCount -eq 0 -and $jsonCount -eq 0) {
            throw "Decryption produced no XML or JSON files."
          }

          "XML files: $xmlCount" >> $env:GITHUB_STEP_SUMMARY
          "JSON files: $jsonCount" >> $env:GITHUB_STEP_SUMMARY

      - name: Commit extracted data
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          git config user.name "github-actions[bot]"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to configure the Git user name."
          }
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to configure the Git user email."
          }
          git add --all -- data
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to stage the extracted data."
          }

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            "No extracted data changes detected." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          if ($LASTEXITCODE -ne 1) {
            throw "Unable to inspect the extracted data changes."
          }

          git diff --cached --stat
          git commit -m "chore: update Albion Online game data"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to commit the extracted data."
          }
          git push origin "HEAD:${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to push the extracted data."
          }

      - name: Delete downloaded game
        if: always()
        shell: pwsh
        run: |
          foreach ($path in @(
            "C:\Albion",
            "C:\Program Files\Albion Online",
            "C:\Program Files (x86)\Albion Online",
            (Join-Path $env:LOCALAPPDATA "Albion Online")
          )) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }
